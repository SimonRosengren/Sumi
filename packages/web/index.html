<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sumi: open-source ticket tracker and Kanban board for humans and AI agents</title>
    <meta
      name="description"
      content="Sumi is a minimal, self-hosted, open-source alternative to Linear, Jira and Trello with a Kanban board for humans and an MCP server and CLI for AI agents."
    />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Sumi: open-source ticket tracker for humans and AI agents" />
    <meta
      property="og:description"
      content="A minimal, self-hosted alternative to Linear, Jira and Trello. Kanban board for humans, MCP server and CLI for agents."
    />
    <script>
      // Set the theme before first paint to avoid a flash. Mirrors src/lib/theme.ts.
      (function () {
        var saved = localStorage.getItem("sumi.theme");
        var dark = saved ? saved === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
        document.documentElement.classList.toggle("dark", dark);
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
